<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>오늘의 출석 | 매일의 작은 습관</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202820;
      --muted: #858d83;
      --line: #e9ece6;
      --green: #2f6b4c;
      --green-dark: #24543b;
      --mint: #e8f1e9;
      --paper: #fff;
      --bg: #f6f7f4;
      --orange: #e7a65a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
    }
    button { font: inherit; }
    .app { max-width: 1120px; padding: 0 34px 48px; margin: 0 auto; }
    .topbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 17px; font-weight: 750; letter-spacing: -.5px; }
    .brand-mark {
      display: grid; place-items: center; width: 35px; height: 35px;
      color: white; background: var(--green); border-radius: 12px;
    }
    .brand-mark svg { width: 20px; height: 20px; }
    .profile { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #e9dfd0; color: #806b51; font-size: 13px; }
    main { padding-top: 40px; }
    .intro { margin-bottom: 26px; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: 1.4px; text-transform: uppercase; }
    h1 { margin: 9px 0 0; font-size: clamp(26px, 4vw, 34px); letter-spacing: -1.6px; line-height: 1.25; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(290px, .85fr); gap: 20px; align-items: stretch; }
    .card { background: var(--paper); border: 1px solid #edf0ea; border-radius: 20px; box-shadow: 0 5px 22px #24362405; }
    .calendar-card { padding: 25px 27px 22px; }
    .calendar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .month-title { display: flex; align-items: baseline; gap: 8px; }
    .month-title strong { font-size: 21px; letter-spacing: -.7px; }
    .month-title span { color: var(--muted); font-size: 13px; }
    .arrows { display: flex; gap: 7px; }
    .icon-button { display: grid; place-items: center; width: 34px; height: 34px; color: #667064; background: white; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: background .18s, transform .18s; }
    .icon-button:hover { background: var(--bg); transform: translateY(-1px); }
    .icon-button:focus-visible, .checkin:focus-visible { outline: 3px solid #91ba9b; outline-offset: 3px; }
    .icon-button svg { width: 16px; height: 16px; }
    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
    .weekdays { margin-bottom: 9px; color: #9aa198; font-size: 11px; font-weight: 650; }
    .weekdays span:first-child { color: #d77973; }
    .day { position: relative; display: flex; justify-content: center; align-items: center; height: 51px; color: #475047; font-size: 13px; }
    .day.empty { pointer-events: none; }
    .day-button { position: relative; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; color: inherit; background: transparent; border: 0; border-radius: 50%; cursor: pointer; transition: .18s ease; }
    .day-button:hover:not(:disabled) { background: #f0f3ed; }
    .day-button:disabled { cursor: default; }
    .day.today .day-button { color: white; background: var(--green); font-weight: 750; }
    .day.checked:not(.today) .day-button { background: var(--mint); color: var(--green-dark); font-weight: 700; }
    .day.checked .day-button::after { position: absolute; bottom: 3px; width: 4px; height: 4px; content: ""; background: #6a9c77; border-radius: 50%; }
    .day.today.checked .day-button::after { background: white; }
    .day.selected .day-button { box-shadow: 0 0 0 2px var(--green); }
    .day.future { color: #c5cac2; }
    .calendar-legend { display: flex; gap: 18px; margin-top: 17px; padding-top: 16px; border-top: 1px solid #f0f1ed; color: var(--muted); font-size: 11px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; background: #b7d5bc; }
    .legend-dot.today-dot { background: var(--green); }
    .side { display: grid; grid-template-rows: 1fr auto; gap: 16px; }
    .checkin-card {
      position: relative; overflow: hidden; min-height: 270px; padding: 26px;
      color: white; background: var(--green); border: 0;
    }
    .checkin-card::after { position: absolute; right: -40px; bottom: -72px; width: 230px; height: 230px; content: ""; border: 1px solid #ffffff20; border-radius: 50%; box-shadow: 0 0 0 26px #ffffff08, 0 0 0 54px #ffffff06; }
    .checkin-top { display: flex; justify-content: space-between; align-items: center; color: #d7e7d9; font-size: 12px; }
    .live-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; background: #a9d48f; border-radius: 50%; }
    .streak { margin-top: 26px; font-size: 14px; color: #e2eee3; }
    .streak strong { display: block; margin-top: 2px; color: white; font-size: 44px; letter-spacing: -2px; line-height: 1.2; }
    .streak strong span { font-size: 17px; letter-spacing: 0; }
    .checkin-note { margin: 8px 0 21px; color: #d7e7d9; font-size: 12px; }
    .checkin { position: relative; z-index: 1; width: 100%; height: 45px; color: var(--green-dark); background: white; border: 0; border-radius: 12px; font-size: 14px; font-weight: 750; cursor: pointer; transition: transform .18s, background .18s; }
    .checkin:hover:not(:disabled) { background: #f0f5ef; transform: translateY(-1px); }
    .checkin:disabled { color: #dcebe0; background: #ffffff20; cursor: default; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { min-height: 105px; padding: 17px; }
    .stat-label { color: var(--muted); font-size: 11px; }
    .stat-number { display: flex; align-items: baseline; gap: 5px; margin-top: 9px; font-size: 25px; font-weight: 750; letter-spacing: -1px; }
    .stat-number span { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0; }
    .bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .bottom-card { min-height: 145px; padding: 22px 24px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .section-heading h2 { margin: 0; font-size: 14px; letter-spacing: -.3px; }
    .section-heading span { color: var(--muted); font-size: 11px; }
    .week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .week-day { display: grid; justify-items: center; gap: 9px; color: #929990; font-size: 10px; }
    .week-status { display: grid; place-items: center; width: 27px; height: 27px; color: #aeb5ab; background: #f3f5f1; border-radius: 50%; font-size: 11px; }
    .week-status.done { color: var(--green); background: var(--mint); }
    .week-status.current { color: white; background: var(--green); }
    .week-day:first-child { color: #d77973; }
    .goal { display: flex; gap: 13px; align-items: center; }
    .goal-icon { flex: 0 0 42px; display: grid; place-items: center; width: 42px; height: 42px; color: #bd8846; background: #fbf2e5; border-radius: 13px; }
    .goal-icon svg { width: 21px; height: 21px; }
    .goal-copy { flex: 1; min-width: 0; }
    .goal-copy strong { display: block; font-size: 12px; }
    .goal-copy p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .progress { height: 5px; margin-top: 13px; overflow: hidden; background: #eff1ec; border-radius: 5px; }
    .progress span { display: block; height: 100%; width: 0; background: var(--orange); border-radius: inherit; transition: width .3s ease; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 5; padding: 12px 18px; color: white; background: #25352a; border-radius: 12px; box-shadow: 0 8px 24px #17231826; font-size: 13px; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: .25s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 760px) {
      .app { padding: 0 20px 34px; }
      .topbar { height: 70px; }
      main { padding-top: 30px; }
      .layout { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
      .checkin-card { min-height: 260px; }
      .stats { grid-template-columns: 1fr; }
      .stat-card { min-height: 0; }
    }
    @media (max-width: 520px) {
      .app { padding: 0 14px 28px; }
      .topbar { height: 64px; }
      .profile > span:first-child { display: none; }
      main { padding-top: 25px; }
      .intro { margin-bottom: 20px; }
      .subtitle { font-size: 12px; }
      .calendar-card { padding: 20px 15px 16px; border-radius: 16px; }
      .calendar-head { margin-bottom: 19px; }
      .month-title strong { font-size: 19px; }
      .day { height: 45px; }
      .day-button { width: 33px; height: 33px; }
      .calendar-legend { gap: 13px; }
      .side { grid-template-columns: 1fr; }
      .checkin-card { min-height: 258px; padding: 23px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat-card { min-height: 94px; padding: 14px; }
      .bottom { grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
      .bottom-card { min-height: 132px; padding: 19px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="m6 12.5 4 4 8-9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        오늘의 출석
      </div>
      <div class="profile"><span>반가워요,</span><span>민지님</span><span class="avatar" aria-hidden="true">민</span></div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow">MY DAILY CHECK-IN</div>
        <h1 id="page-title">꾸준함이 만드는 작은 변화</h1>
        <p class="subtitle">오늘도 한 걸음, 나만의 리듬을 이어가 볼까요?</p>
      </section>

      <div class="layout">
        <section class="card calendar-card" aria-label="출석 달력">
          <div class="calendar-head">
            <div class="month-title"><strong id="month-label"></strong><span>출석 달력</span></div>
            <div class="arrows">
              <button class="icon-button" id="prev-month" aria-label="이전 달">
                <svg viewBox="0 0 24 24" fill="none"><path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="icon-button" id="next-month" aria-label="다음 달">
                <svg viewBox="0 0 24 24" fill="none"><path d="m9.5 5 7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div class="weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="days" id="calendar-days" role="grid" aria-label="월별 출석 날짜"></div>
          <div class="calendar-legend">
            <span class="legend-item"><i class="legend-dot today-dot"></i>오늘</span>
            <span class="legend-item"><i class="legend-dot"></i>출석 완료</span>
          </div>
        </section>

        <div class="side">
          <section class="card checkin-card" aria-label="오늘 출석">
            <div class="checkin-top"><span><i class="live-dot"></i>오늘의 출석</span><span id="today-date"></span></div>
            <div class="streak">연속 출석<strong><span id="streak-count">0</span><span>일째</span></strong></div>
            <p class="checkin-note" id="checkin-note">매일의 체크인이 좋은 습관이 돼요.</p>
            <button class="checkin" id="checkin-button">오늘 출석 체크하기</button>
          </section>
          <div class="stats">
            <section class="card stat-card">
              <div class="stat-label">이번 달 출석</div>
              <div class="stat-number"><b id="month-count">0</b><span>일</span></div>
            </section>
            <section class="card stat-card">
              <div class="stat-label">누적 출석</div>
              <div class="stat-number"><b id="total-count">0</b><span>일</span></div>
            </section>
          </div>
        </div>
      </div>

      <div class="bottom">
        <section class="card bottom-card">
          <div class="section-heading"><h2>이번 주 출석</h2><span id="week-range"></span></div>
          <div class="week-row" id="week-row" aria-label="이번 주 출석 현황"></div>
        </section>
        <section class="card bottom-card">
          <div class="section-heading"><h2>이번 달 목표</h2><span id="goal-summary"></span></div>
          <div class="goal">
            <div class="goal-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5v3m6.01-.51-2.12 2.12M20.5 12h-3M5.88 8.11 3.76 5.99M6.5 12H3.5m4.2 4.2a6.08 6.08 0 1 1 8.6 0c-.9.9-1.3 1.5-1.3 2.3H9.9c0-.8-.4-1.4-1.3-2.3ZM9.7 21h4.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="goal-copy">
              <strong>한 달 20일 출석하기</strong>
              <p id="goal-copy">매일 조금씩, 목표에 가까워지고 있어요.</p>
              <div class="progress" role="progressbar" aria-label="이번 달 목표 달성률" aria-valuemin="0" aria-valuemax="20" id="goal-progress"><span></span></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const STORAGE_KEY = "daily-attendance-v1";
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const toKey = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      const fromKey = key => {
        const [year, month, day] = key.split("-").map(Number);
        return new Date(year, month - 1, day);
      };
      let attendance;
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        attendance = new Set(Array.isArray(stored) ? stored.filter(value => /^\d{4}-\d{2}-\d{2}$/.test(value)) : []);
      } catch (error) {
        console.error("출석 기록을 불러오지 못했습니다.", error);
        attendance = new Set();
      }
      let shown = new Date(today.getFullYear(), today.getMonth(), 1);
      let selectedKey = toKey(today);

      const monthLabel = document.getElementById("month-label");
      const calendar = document.getElementById("calendar-days");
      const button = document.getElementById("checkin-button");
      const toast = document.getElementById("toast");
      const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify([...attendance].sort()));
        } catch (error) {
          console.error("출석 기록을 저장하지 못했습니다.", error);
          showToast("기록을 저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.");
        }
      }

      function streakLength() {
        let cursor = new Date(today);
        if (!attendance.has(toKey(cursor))) cursor.setDate(cursor.getDate() - 1);
        let count = 0;
        while (attendance.has(toKey(cursor))) {
          count++;
          cursor.setDate(cursor.getDate() - 1);
        }
        return count;
      }

      function renderCalendar() {
        const year = shown.getFullYear();
        const month = shown.getMonth();
        monthLabel.textContent = `${year}년 ${month + 1}월`;
        calendar.replaceChildren();
        const offset = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < offset; i++) {
          const blank = document.createElement("span");
          blank.className = "day empty";
          blank.setAttribute("role", "gridcell");
          calendar.append(blank);
        }
        for (let number = 1; number <= daysInMonth; number++) {
          const date = new Date(year, month, number);
          const key = toKey(date);
          const isToday = key === toKey(today);
          const isFuture = date > today;
          const cell = document.createElement("span");
          cell.className = "day";
          cell.setAttribute("role", "gridcell");
          if (isToday) cell.classList.add("today");
          if (attendance.has(key)) cell.classList.add("checked");
          if (key === selectedKey) cell.classList.add("selected");
          if (isFuture) cell.classList.add("future");
          const dayButton = document.createElement("button");
          dayButton.className = "day-button";
          dayButton.type = "button";
          dayButton.textContent = number;
          dayButton.setAttribute("aria-label", `${year}년 ${month + 1}월 ${number}일${attendance.has(key) ? ", 출석 완료" : ""}${isToday ? ", 오늘" : ""}`);
          dayButton.setAttribute("aria-pressed", String(key === selectedKey));
          dayButton.disabled = isFuture;
          dayButton.addEventListener("click", () => { selectedKey = key; renderCalendar(); });
          cell.append(dayButton);
          calendar.append(cell);
        }
      }

      function renderWeek() {
        const start = new Date(today);
        start.setDate(today.getDate() - today.getDay());
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        document.getElementById("week-range").textContent = `${start.getMonth() + 1}.${start.getDate()} – ${end.getMonth() + 1}.${end.getDate()}`;
        const row = document.getElementById("week-row");
        row.replaceChildren();
        for (let i = 0; i < 7; i++) {
          const date = new Date(start);
          date.setDate(start.getDate() + i);
          const key = toKey(date);
          const item = document.createElement("div");
          item.className = "week-day";
          item.innerHTML = `<span>${dayNames[i]}</span>`;
          const status = document.createElement("span");
          status.className = "week-status";
          status.textContent = attendance.has(key) ? "✓" : "·";
          if (attendance.has(key)) status.classList.add("done");
          else if (key === toKey(today)) status.classList.add("current");
          item.append(status);
          row.append(item);
        }
      }

      function render() {
        renderCalendar();
        renderWeek();
        const monthPrefix = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-`;
        const monthCount = [...attendance].filter(key => key.startsWith(monthPrefix)).length;
        document.getElementById("streak-count").textContent = streakLength();
        document.getElementById("month-count").textContent = monthCount;
        document.getElementById("total-count").textContent = attendance.size;
        const goal = Math.min(monthCount, 20);
        document.getElementById("goal-summary").textContent = `${goal} / 20일`;
        document.getElementById("goal-copy").textContent = goal >= 20 ? "목표를 달성했어요! 정말 멋져요." : `목표까지 ${20 - goal}일 남았어요.`;
        const progress = document.querySelector("#goal-progress span");
        progress.style.width = `${goal / 20 * 100}%`;
        document.getElementById("goal-progress").setAttribute("aria-valuenow", goal);
        const done = attendance.has(toKey(today));
        button.disabled = done;
        button.textContent = done ? "오늘 출석 완료 ✓" : "오늘 출석 체크하기";
        document.getElementById("checkin-note").textContent = done ? "오늘도 좋은 습관을 이어갔어요!" : "매일의 체크인이 좋은 습관이 돼요.";
        document.getElementById("today-date").textContent = `${today.getMonth() + 1}월 ${today.getDate()}일 ${dayNames[today.getDay()]}요일`;
      }

      let toastTimer;
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
      }

      document.getElementById("prev-month").addEventListener("click", () => {
        shown = new Date(shown.getFullYear(), shown.getMonth() - 1, 1);
        renderCalendar();
      });
      document.getElementById("next-month").addEventListener("click", () => {
        const next = new Date(shown.getFullYear(), shown.getMonth() + 1, 1);
        if (next <= new Date(today.getFullYear(), today.getMonth(), 1)) {
          shown = next;
          renderCalendar();
        }
      });
      button.addEventListener("click", () => {
        const key = toKey(today);
        if (attendance.has(key)) return;
        attendance.add(key);
        save();
        selectedKey = key;
        render();
        showToast("출석 완료! 오늘도 꾸준히 해냈어요 🌿");
      });

      render();
    })();
  </script>
</body>
</html>
